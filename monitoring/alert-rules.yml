groups:
  - name: todo-summary-assistant-alerts
    interval: 15s
    rules:
      - alert: BackendDown
        expr: up{job="todo-backend"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Todo backend is down"
          description: "The backend target has been unavailable for more than 2 minutes."

      - alert: HighErrorRate
        expr: |
          (
            sum(rate(http_server_requests_seconds_count{job="todo-backend",status=~"5.."}[5m]))
            /
            clamp_min(sum(rate(http_server_requests_seconds_count{job="todo-backend"}[5m])), 0.001)
          ) > 0.05
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High backend HTTP error rate"
          description: "More than 5 percent of backend HTTP requests are returning 5xx errors."

      - alert: HighJvmMemoryUsage
        expr: |
          (
            sum(jvm_memory_used_bytes{job="todo-backend",area="heap"})
            /
            clamp_min(sum(jvm_memory_max_bytes{job="todo-backend",area="heap"}), 1)
          ) > 0.85
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High JVM heap usage"
          description: "Backend JVM heap usage exceeds 85 percent."
