name: TodoSummaryAssistant CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build-and-push:
    name: Build and Push Docker Images
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: ./Backend/todo-summary-assistant
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/todo-backend:${{ github.sha }}
            ${{ secrets.DOCKERHUB_USERNAME }}/todo-backend:latest

      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./Frontend/todo
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/todo-frontend:${{ github.sha }}
            ${{ secrets.DOCKERHUB_USERNAME }}/todo-frontend:latest

  deploy:
    name: Deploy to EC2
    needs: build-and-push
    runs-on: ubuntu-latest

    steps:
      - name: Deploy application to EC2
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e

            cd ~/TodoSummaryAssistant-DevOps

            echo "Pulling latest Docker images..."

            docker pull ${{ secrets.DOCKERHUB_USERNAME }}/todo-backend:latest
            docker pull ${{ secrets.DOCKERHUB_USERNAME }}/todo-frontend:latest

            echo "Stopping old containers..."

            docker rm -f todo-frontend || true
            docker rm -f todo-backend || true

            echo "Starting backend..."

            docker run -d \
              --name todo-backend \
              --network todo-network \
              --env-file Backend/todo-summary-assistant/.env \
              ${{ secrets.DOCKERHUB_USERNAME }}/todo-backend:latest

            echo "Adding backend network alias..."

            docker network disconnect todo-network todo-backend || true
            docker network connect --alias backend todo-network todo-backend

            echo "Starting frontend..."

            docker run -d \
              --name todo-frontend \
              --network todo-network \
              -p 80:8080 \
              ${{ secrets.DOCKERHUB_USERNAME }}/todo-frontend:latest

            echo "Waiting for application..."

            sleep 15

            echo "Checking frontend..."

            curl -f http://localhost/

            echo "Checking backend through frontend..."

            curl -f http://localhost/api/todos

            echo "Deployment successful!"