name: TodoSummaryAssistant CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

env:
  AWS_REGION: eu-north-1
  AWS_ROLE_ARN: arn:aws:iam::531342907300:role/TodoSummaryAssistant-GitHubActions-Role
  EC2_INSTANCE_ID: i-0aacb0bdcdcbaf303

jobs:
  build-and-push:
    name: Build Docker Images
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: ./Backend/todo-summary-assistant
          push: ${{ github.event_name == 'push' }}
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/todo-backend:${{ github.sha }}
            ${{ secrets.DOCKERHUB_USERNAME }}/todo-backend:latest

      - name: Build frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./Frontend/todo
          push: ${{ github.event_name == 'push' }}
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/todo-frontend:${{ github.sha }}
            ${{ secrets.DOCKERHUB_USERNAME }}/todo-frontend:latest

  deploy:
    name: Deploy to EC2 using SSM
    needs: build-and-push
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Configure AWS credentials using OIDC
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          role-session-name: GitHubActionsDeployment
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy application through AWS SSM
        shell: bash
        run: |
          set -e

          echo "Sending deployment command to EC2..."

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "${EC2_INSTANCE_ID}" \
            --document-name "AWS-RunShellScript" \
            --comment "Deploy TodoSummaryAssistant ${GITHUB_SHA}" \
            --parameters 'commands=[
              "set -e",
              "cd /home/ubuntu/TodoSummaryAssistant-DevOps",
              "echo Pulling exact Docker images...",
              "docker pull '"${{ secrets.DOCKERHUB_USERNAME }}"'/todo-backend:'"${GITHUB_SHA}"'",
              "docker pull '"${{ secrets.DOCKERHUB_USERNAME }}"'/todo-frontend:'"${GITHUB_SHA}"'",
              "echo Ensuring Docker network exists...",
              "docker network inspect todo-network >/dev/null 2>&1 || docker network create todo-network",
              "echo Stopping old containers...",
              "docker rm -f todo-frontend || true",
              "docker rm -f todo-backend || true",
              "echo Starting backend...",
              "docker run -d --name todo-backend --network todo-network --network-alias backend --env-file Backend/todo-summary-assistant/.env '"${{ secrets.DOCKERHUB_USERNAME }}"'/todo-backend:'"${GITHUB_SHA}"'",
              "echo Starting frontend...",
              "docker run -d --name todo-frontend --network todo-network -p 80:8080 '"${{ secrets.DOCKERHUB_USERNAME }}"'/todo-frontend:'"${GITHUB_SHA}"'",
              "echo Waiting for application...",
              "sleep 15",
              "echo Checking frontend...",
              "curl -f http://localhost/",
              "echo Checking backend through frontend...",
              "curl -f http://localhost/api/todos",
              "echo Checking backend health...",
             "docker exec todo-frontend wget -qO- http://backend:8080/actuator/health | grep -q UP",
              "echo Deployment successful!"
            ]' \
            --query "Command.CommandId" \
            --output text)

          echo "SSM Command ID: $COMMAND_ID"

          echo "Waiting for deployment to complete..."

          for i in {1..30}; do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "${EC2_INSTANCE_ID}" \
              --query "Status" \
              --output text 2>/dev/null || true)

            echo "Deployment status: $STATUS"

            if [ "$STATUS" = "Success" ]; then
              echo "Deployment completed successfully."

              aws ssm get-command-invocation \
                --command-id "$COMMAND_ID" \
                --instance-id "${EC2_INSTANCE_ID}" \
                --query "StandardOutputContent" \
                --output text

              exit 0
            fi

            if [ "$STATUS" = "Failed" ] || \
               [ "$STATUS" = "Cancelled" ] || \
               [ "$STATUS" = "TimedOut" ]; then

              echo "Deployment failed."

              aws ssm get-command-invocation \
                --command-id "$COMMAND_ID" \
                --instance-id "${EC2_INSTANCE_ID}" \
                --query "StandardErrorContent" \
                --output text

              exit 1
            fi

            sleep 10
          done

          echo "Deployment timed out."
          exit 1